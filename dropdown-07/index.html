<!doctype html>
<html lang="en">
  <head>
  	<title>Dropdown 07</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

			<link rel="stylesheet" href="css/style.css">
</head>
  <body>
		
		<section class="ftco-section">
			<div class="cl-container">
				<div class="cl-row">
					<div class="cl-col-md-12 cl-text-center">
						<h2 class="heading-section cl-mb-4 cl-pb-md-4">Dropdown #07</h2>
					</div>
				</div>
				<div class="cl-row cl-justify-content-center">

					<div class="cl-col-md-12 cl-d-flex cl-justify-content-center">
						<div class="cl-btn-group">
						  <button type="button" class="cl-btn cl-btn-primary cl-dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						    Sign Up
						  </button>
						  <form class="cl-dropdown-menu cl-dropdown-menu-left cl-px-4 cl-pt-4">
						  	<div class="heading-title">
						  		<h3>Create Your Account</h3>
						  	</div>
						  	<div class="cl-form-group">
							    <label for="exampleDropdownFormFullName">Full Name</label>
							    <input type="email" class="cl-form-control" id="exampleDropdownFullName" placeholder="John Doe">
							  </div>
							  <div class="cl-form-group">
							    <label for="exampleDropdownFormEmail2">Email address</label>
							    <input type="email" class="cl-form-control" id="exampleDropdownFormEmail2" placeholder="email@example.com">
							  </div>
							  <div class="cl-form-group">
							    <label for="exampleDropdownFormPassword2">Password</label>
							    <input type="password" class="cl-form-control" id="exampleDropdownFormPassword2" placeholder="Password">
							  </div>
							  <div class="cl-d-flex cl-justify-content-between cl-align-items-center">
								  <div class="cl-form-check cl-mb-4">
								    <input type="checkbox" class="cl-form-check-input" id="dropdownCheck2">
								    <label class="cl-form-check-label" for="dropdownCheck2">
								      Remember me
								    </label>
								  </div>
								  <button type="submit" class="cl-btn cl-btn-primary">Sign in</button>
							  </div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</section>

    	<script src="js/snippet.js"></script>
</body>
</html>
