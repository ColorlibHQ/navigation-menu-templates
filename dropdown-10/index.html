<!doctype html>
<html lang="en">
  <head>
  	<title>Dropdown 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

			<link rel="stylesheet" href="css/style.css">
</head>
  <body>
		
		<section class="ftco-section">
			<div class="cl-container">
				<div class="cl-row">
					<div class="cl-col-md-12 cl-text-center">
						<h2 class="heading-section cl-mb-4">Dropdown #10</h2>
					</div>
				</div>
				<div class="cl-row cl-justify-content-center">

					<div class="cl-col-md-12 cl-d-flex cl-justify-content-center">
						<div class="cl-btn-group">
						  <button type="button" class="cl-btn cl-btn-primary cl-dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						    Request A Quote
						  </button>
						  <form class="cl-dropdown-menu cl-dropdown-menu-left">
						  	<div class="heading-title cl-py-4 cl-px-4">
						  		<h3 class="cl-mb-0">Consultation</h3>
						  	</div>
						  	<div class="cl-px-4">
							  	<div class="cl-form-group">
								    <input type="email" class="cl-form-control" id="exampleDropdownFullName" placeholder="Full Name">
								  </div>
								  <div class="cl-form-group">
								    <input type="email" class="cl-form-control" id="exampleDropdownFormEmail2" placeholder="Email Address">
								  </div>
								  <div class="cl-form-group">
								    <input type="email" class="cl-form-control" id="exampleDropdownSubject" placeholder="Subject">
								  </div>
								  <div class="cl-form-group">
			              <textarea name="" id="" cols="30" rows="3" class="cl-form-control" placeholder="Message"></textarea>
			            </div>
								  <button type="submit" class="cl-btn cl-btn-primary">Send A Message</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</section>

    	<script src="js/snippet.js"></script>
</body>
</html>
